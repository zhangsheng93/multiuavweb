    <path d="M47 155C210 106 307 95 449 145c94 33 176 30 257-9" fill="none" stroke="#ffffff" stroke-width="20"/>
    <path d="M90 570c122-38 225-38 330 12 82 39 175 26 274-41" fill="none" stroke="#ffffff" stroke-width="18"/>
    <path d="M207 5c-14 143 6 251 61 323 65 85 88 169 68 252" fill="none" stroke="#ffffff" stroke-width="15"/>
  </g>

  <g opacity="0.58">
