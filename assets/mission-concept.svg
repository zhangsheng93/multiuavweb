<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 760" role="img" aria-labelledby="title desc">
  <title id="title">Multi-UAV benchmark mission concept</title>
  <desc id="desc">A conceptual aerial mission map with UAV routes, assigned areas, target markers, and validation status points.</desc>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfeaf8"/>
      <stop offset="1" stop-color="#2c8fc4"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6f2df"/>
      <stop offset="0.55" stop-color="#cadfbd"/>
      <stop offset="1" stop-color="#a9c99e"/>
    </linearGradient>
    <linearGradient id="city" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f1"/>
      <stop offset="1" stop-color="#d7e0dd"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0c4f7d" flood-opacity="0.18"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.18"/>
    </pattern>
  </defs>

  <rect width="1160" height="760" rx="18" fill="#f7fbff"/>
  <path d="M0 0H1160V760H0Z" fill="url(#land)"/>
  <path d="M734 0c-30 88-18 166 34 234 61 79 77 145 47 220-29 72-23 136 18 192 37 51 95 85 157 114h170V0Z" fill="url(#sea)"/>
  <path d="M0 0H1160V760H0Z" fill="url(#grid)"/>

